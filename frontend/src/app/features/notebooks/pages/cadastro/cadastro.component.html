<mat-card>
  <mat-card-header>
    <mat-card-title> Cadastro de Notebook </mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="salvar()">
      <mat-form-field appearance="outline">
        <mat-label> Nome </mat-label>

        <input matInput formControlName="nome" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label> Descrição </mat-label>

        <textarea matInput rows="3" formControlName="descricao"> </textarea>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label> Preço </mat-label>

        <input matInput type="number" formControlName="preco" />
      </mat-form-field>

      <mat-divider></mat-divider>

      <div class="acessorios-header">
        <h3>Acessórios</h3>

        <button
          mat-raised-button
          color="primary"
          type="button"
          (click)="adicionarAcessorio()"
        >
          <mat-icon> add </mat-icon>

          Adicionar acessório
        </button>
      </div>

      <div formArrayName="acessorios">
        <mat-card
          class="acessorio"
          *ngFor="let acessorio of acessorios.controls; let i = index"
          [formGroupName]="i"
        >
          <mat-form-field appearance="outline">
            <mat-label> Nome </mat-label>

            <input matInput formControlName="nome" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label> Descrição </mat-label>

            <input matInput formControlName="descricao" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label> Preço </mat-label>

            <input matInput type="number" formControlName="preco" />
          </mat-form-field>

          <button
            mat-icon-button
            color="warn"
            type="button"
            (click)="removerAcessorio(i)"
          >
            <mat-icon> delete </mat-icon>
          </button>
        </mat-card>
      </div>

      <button
        mat-raised-button
        color="accent"
        type="submit"
        [disabled]="form.invalid"
      >
        Salvar Notebook
      </button>
    </form>
  </mat-card-content>
</mat-card>
