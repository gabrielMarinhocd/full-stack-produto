<mat-card>
  <mat-card-header class="header-cadastro">
    <mat-card-title>Cadastro de Notebook</mat-card-title>
  
    <button
      mat-icon-button
      color="warn"
      type="button"
      (click)="fechar()"
      matTooltip="Fechar"
    >
      <mat-icon>close</mat-icon>
    </button>
  </mat-card-header>

  <mat-card-content>
    <!-- FORM NOTEBOOK -->
    <form [formGroup]="notebookForm" (ngSubmit)="salvarNotebook()">
      <h3>Formulario de cadastro</h3>

      <mat-form-field appearance="outline">
        <mat-label> Nome </mat-label>

        <input matInput formControlName="nome" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label> Descrição </mat-label>

        <textarea matInput rows="3" formControlName="descricao"> </textarea>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label> Preço </mat-label>

        <input matInput type="number" formControlName="preco" />
      </mat-form-field>

      <mat-divider></mat-divider>

      <div class="acessorios-header">
        <h3>Acessórios</h3>

        <button
          mat-raised-button
          color="primary"
          type="button"
          (click)="adicionarAcessorio()"
        >
          <mat-icon> add </mat-icon>

          Adicionar acessório
        </button>
      </div>

      <!-- FORM CADASTRO ACESSORIO -->
      @if (mostrarCadastroAcessorio) {

      <mat-card class="acessorio-form" [formGroup]="acessorioForm">
        <mat-card-title> Novo Acessório </mat-card-title>

        <mat-form-field appearance="outline">
          <mat-label> Nome </mat-label>

          <input matInput formControlName="nome" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label> Descrição </mat-label>

          <input matInput formControlName="descricao" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label> Preço </mat-label>

          <input matInput type="number" formControlName="preco" />
        </mat-form-field>

        <button
          mat-raised-button
          color="accent"
          type="button"
          (click)="salvarAcessorio()"
        >
          Salvar acessório
        </button>
      </mat-card>

      }

      <br />

      <h3>Acessórios adicionados</h3>

      <table mat-table [dataSource]="acessorios" class="mat-elevation-z8">
        <!-- Nome -->
        <ng-container matColumnDef="nome">
          <th mat-header-cell *matHeaderCellDef>Nome</th>

          <td mat-cell *matCellDef="let item">
            {{ item.nome }}
          </td>
        </ng-container>

        <!-- Descricao -->
        <ng-container matColumnDef="descricao">
          <th mat-header-cell *matHeaderCellDef>Descrição</th>

          <td mat-cell *matCellDef="let item">
            {{ item.descricao }}
          </td>
        </ng-container>

        <!-- Preco -->
        <ng-container matColumnDef="preco">
          <th mat-header-cell *matHeaderCellDef>Preço</th>

          <td mat-cell *matCellDef="let item">
            {{ item.preco | currency : "BRL" }}
          </td>
        </ng-container>

        <!-- Ação -->
        <ng-container matColumnDef="acao">
          <th mat-header-cell *matHeaderCellDef>Ação</th>

          <td mat-cell *matCellDef="let item; let i = index">
            <button
              mat-icon-button
              color="warn"
              type="button"
              (click)="removerAcessorio(i)"
            >
              <mat-icon> delete </mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>

      <br />

      <button
        mat-raised-button
        color="accent"
        type="submit"
        [disabled]="notebookForm.invalid"
      >
        Salvar Notebook
      </button>
    </form>
  </mat-card-content>
</mat-card>
