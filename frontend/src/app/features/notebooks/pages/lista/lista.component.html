<mat-card>
  <mat-card-header class="header-notebooks">
    <mat-card-title>Notebooks cadastrados</mat-card-title>

    <div class="toolbar">
      <mat-form-field appearance="outline" class="campo-pesquisa">
        <mat-label>Pesquisar por acessório</mat-label>

        <input
          matInput
          [(ngModel)]="nomeAcessorio"
          (input)="pesquisar()"
          placeholder="Ex.: Mouse"
        />

        <button
          *ngIf="nomeAcessorio"
          matSuffix
          mat-icon-button
          type="button"
          (click)="limparPesquisa()"
        >
          <mat-icon>close</mat-icon>
        </button>
      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        routerLink="/notebooks/cadastrar"
      >
        <mat-icon>add</mat-icon>
        Cadastrar Notebook
      </button>
    </div>
  </mat-card-header>

  <mat-card-content>
    <table mat-table [dataSource]="notebooks" class="mat-elevation-z8">
      <!-- Nome -->
      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef>Nome</th>

        <td mat-cell *matCellDef="let notebook">
          {{ notebook.nome }}
        </td>
      </ng-container>

      <!-- Descrição -->
      <ng-container matColumnDef="descricao">
        <th mat-header-cell *matHeaderCellDef>Descrição</th>

        <td mat-cell *matCellDef="let notebook">
          {{ notebook.descricao }}
        </td>
      </ng-container>

      <!-- Preço -->
      <ng-container matColumnDef="preco">
        <th mat-header-cell *matHeaderCellDef>Preço</th>

        <td mat-cell *matCellDef="let notebook">
          {{ notebook.preco | currency : "BRL" }}
        </td>
      </ng-container>

      <!-- Acessórios -->
      <ng-container matColumnDef="acessorios">
        <th mat-header-cell *matHeaderCellDef>Acessórios</th>

        <td mat-cell *matCellDef="let notebook">
          <mat-chip-set>
            <mat-chip *ngFor="let acessorio of notebook.acessorios">
              {{ acessorio.nome }}
            </mat-chip>
          </mat-chip-set>
        </td>
      </ng-container>

      <!-- Ações -->
      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>Ações</th>

        <td mat-cell *matCellDef="let notebook">
          <button mat-icon-button color="primary" (click)="editar(notebook.id)">
            <mat-icon>edit</mat-icon>
          </button>

          <button mat-icon-button color="warn" (click)="excluir(notebook.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </mat-card-content>
</mat-card>
